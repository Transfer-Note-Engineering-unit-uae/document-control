<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a3c">
<title>EU Document Control</title>
<style>
html,body{margin:0;height:100%;background:#f3f5f8;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#6b7585;font-size:14px}
#ld b{width:46px;height:46px;border-radius:11px;background:#1c74e9;color:#fff;display:grid;place-items:center;font-weight:900}
</style>
</head>
<body>
<div id="ld"><b>EU</b>Loading EU Document Control...</div>
<iframe id="app" title="EU Document Control" allow="clipboard-write"></iframe>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyJciSE-nAooubp-hOYyXYTMQg0RclnWEjuTKyjHjLFz-8toDd2S8e65NzKE5jlTZy4/exec";
var f = document.getElementById("app");
f.addEventListener("load", function(){ document.getElementById("ld").style.display = "none"; });
f.src = EXEC + (location.search || "");
</script>
</body>
</html>
